# Build + publish the messaging-api image to GHCR on every main push, then
# (optionally) close the GitOps loop by bumping the tag in shipit-platform.
name: shipit-publish

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests -q
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (scan before push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ghcr.io/samir-khadka/messaging-api:${{ github.sha }}
      - name: Scan image with Trivy
        # Gate: fail on HIGH/CRITICAL vulnerabilities that have a fix
        # available. ignore-unfixed keeps the gate actionable — it blocks
        # on what we can fix, not on unfixable base-image noise.
        # TEMP-DIAG: json output + annotation below to surface the exact
        # CVE list (revert to table/exit-code 1 once the base is clean).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/samir-khadka/messaging-api:${{ github.sha }}
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Report Trivy findings as annotation (TEMP-DIAG)
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open("trivy.json"))
          findings = []
          for r in d.get("Results", []):
              for v in r.get("Vulnerabilities", []) or []:
                  findings.append(
                      f"{v['VulnerabilityID']} {v['Severity']} "
                      f"{v['PkgName']}@{v['InstalledVersion']} "
                      f"(fixed: {v.get('FixedVersion', '?')}) [{r.get('Target')}]"
                  )
          if findings:
              print("::error::TRIVY-GATE-FINDINGS: " + " | ".join(findings))
              raise SystemExit(1)
          print("Trivy gate clean: no HIGH/CRITICAL with fixes.")
          EOF
      - name: Push image to GHCR
        run: docker push ghcr.io/samir-khadka/messaging-api:${{ github.sha }}

  bump-shipit:
    # Closes the GitOps loop: after the image lands in GHCR, write the new
    # :<sha> tag back into Samir-Khadka/shipit-platform (k8s/services/messaging)
    # so ArgoCD syncs it. Needs a SHIPIT_BUMP_PAT secret on THIS repo — a PAT
    # with repo write access to Samir-Khadka/shipit-platform.
    # WITHOUT the PAT, the guard step below records present=false, the rest
    # skip (green, no-op), and Samir bumps manually:
    #   cd shipit-platform && ./scripts/bump-service-image.sh messaging-api <sha>
    # (The `secrets` context is not allowed in a job-level `if`, so the
    # presence check runs as a step and later steps gate on its output.)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check for SHIPIT_BUMP_PAT
        id: pat
        env:
          PAT: ${{ secrets.SHIPIT_BUMP_PAT }}
        run: |
          if [ -n "$PAT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.pat.outputs.present == 'true'
        with:
          repository: Samir-Khadka/shipit-platform
          token: ${{ secrets.SHIPIT_BUMP_PAT }}
      - name: Bump messaging-api image tag to the new sha
        if: steps.pat.outputs.present == 'true'
        run: |
          set -e
          SHA="${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2; do
            git fetch origin main
            git reset --hard origin/main
            sed -i -E "s#(image: ghcr.io/samir-khadka/messaging-api:)[^[:space:]]+#\1${SHA}#" k8s/services/messaging/*.yaml
            git add k8s/services/messaging/
            if git diff --cached --quiet; then
              echo "image tag already at ${SHA}; nothing to do"
              exit 0
            fi
            git commit -m "[service-bump] messaging-api -> ${SHA}"
            if git push origin main; then
              echo "tag bump pushed"
              exit 0
            fi
            echo "push raced (attempt ${attempt}/2), retrying..."
            sleep 10
          done
          echo "failed to push tag bump after 2 attempts" >&2
          exit 1
