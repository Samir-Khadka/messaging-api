services:
  - type: web
    name: messaging-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      # Start in dev mode (console provider, dev key) until a real
      # provider is configured. Flip to false when keys are set.
      - key: DEV_MODE
        value: "true"
      - key: DATABASE_PATH
        value: "./data/messaging.db"
      # Secrets: set in the Render dashboard, never in this file.
      - key: MESSAGING_API_KEYS
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: SMS_PROVIDER
        value: "console"
      - key: WHATSAPP_PROVIDER
        value: "console"
      - key: RCS_PROVIDER
        value: "console"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
